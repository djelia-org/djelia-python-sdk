repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        #args: [--force-exclude=false] 

  - repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]