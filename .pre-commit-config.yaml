repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        #args: [--force-exclude=false] 

  - repo: https://github.com/pycqa/isort
    rev: 10.0.0b2
    hooks:
      - id: isort
        args: ["--profile", "black"]